<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">STARCRAFT · COMPETITIVE LADDER</div>
    <h1>SC ELO BOARD</h1>
    <p class="sub">디스코드 경기 등록과 자동 연동되는 스타크래프트 랭킹 보드</p>
    <div class="live"><span class="dot"></span> 데이터 자동 연동 <span id="lastSync"></span></div>
  </header>
  <section class="stats">
    <div class="stat"><span>진행 중인 시즌</span><strong id="activeSeason">불러오는 중</strong></div>
    <div class="stat"><span>등록 선수</span><strong id="playerCount">-</strong></div>
    <div class="stat"><span>현재 시즌 경기</span><strong id="matchCount">-</strong></div>
  </section>
  <nav class="tabs" aria-label="보드 메뉴">
    <button class="tab active" data-tab="ranking">🏆 랭킹</button>
    <button class="tab" data-tab="matches">⚔️ 최근 경기</button>
    <button class="tab" data-tab="teammatches">🛡️ 대항전 기록</button>
    <button class="tab" data-tab="teambattleinput">✍️ 대항전 입력</button>
    <button class="tab" data-tab="matchregister">📝 경기 결과 등록</button>
    <button class="tab" data-tab="players">🔎 선수 검색</button>
    <button class="tab" data-tab="register">➕ 선수 등록</button>
    <button class="tab" data-tab="bulkregister">📋 선수 일괄 등록</button>
    <button class="tab" data-tab="manage">🛠️ 선수 관리</button>
    <button class="tab" data-tab="headtohead">⚔️ 상대 전적</button>
    <button class="tab" data-tab="seasons">📅 시즌 기록</button>
  </nav>
  <main id="content" class="panel"><p class="empty">데이터를 불러오는 중입니다…</p></main>
  <footer>SC ELO BOARD · 경기 데이터는 디스코드 봇에서 자동 갱신됩니다.<br><span id="updated"></span> · 60초마다 새로고침</footer>
</div>
<script>
let boardData = null;
let currentTab = "ranking";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = p => p?.win_rate ?? ((Number(p?.wins||0)+Number(p?.losses||0)) ? (Number(p.wins)/(Number(p.wins)+Number(p.losses))*100).toFixed(1) : "0.0");
const medal = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}위`;
const playerButton = name => `<button class="player-link" data-player="${esc(name)}">${esc(name)}</button>`;
function showRanking(players, title="현재 시즌 랭킹", podium=true) {
  players = [...(players||[])].sort((a,b)=>Number(b.elo)-Number(a.elo)||Number(b.wins)-Number(a.wins));
  if (!players.length) return `<h2>${esc(title)}</h2><p class="empty">표시할 선수 기록이 없습니다.</p>`;
  const top = podium ? `<div class="podium">${players.slice(0,3).map((p,i)=>`<div class="podium-card ${i===0?'first':''}"><div class="medal">${medal(i)}</div><span class="podium-name">${playerButton(p.name)}</span><div class="podium-elo">${Number(p.elo).toLocaleString()} ELO</div><div class="podium-sub">${p.wins||0}승 ${p.losses||0}패 · 승률 ${pct(p)}%</div></div>`).join("")}</div>` : "";
  return `<div class="section-head"><h2>${esc(title)}</h2><span class="muted">${players.length}명</span></div>${top}
    <div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>종족</th><th>ELO</th><th>등급</th><th>전적</th><th>승률</th></tr></thead><tbody>
    ${players.map((p,i)=>`<tr><td class="rankno">${medal(i)}</td><td>${playerButton(p.name)}</td><td>${esc(p.race||"미정")}</td><td class="elo">${Number(p.elo).toLocaleString()}</td><td><span class="badge ${esc(p.rank)}">${esc(p.rank||"-")}</span></td><td>${p.wins||0}승 ${p.losses||0}패</td><td>${pct(p)}%</td></tr>`).join("")}
    </tbody></table></div>`;
}
function showMatches(matches=boardData.matches||[], title="최근 경기") {
  if (!matches.length) return `<h2>${esc(title)}</h2><p class="empty">표시할 경기 기록이 없습니다.</p>`;
  return `<div class="section-head"><h2>${esc(title)}</h2><span class="muted">최근 ${matches.length}경기</span></div><div class="matches">
    ${matches.map(m=>`<article class="match"><div class="match-top"><div><span class="winner">${playerButton(m.winner)}</span> <span class="muted">승리 vs</span> <span class="loser">${playerButton(m.loser)}</span></div><span class="muted">경기 #${esc(m.id)}</span></div>

function playerMatchList(name) {

function eloHistory(name) {

    const before=Number(isWinner?m.winner_elo_before:m.loser_elo_before);
    const after=Number(isWinner?m.winner_elo_after:m.loser_elo_after);
    if(Number.isFinite(before)&&Number.isFinite(after)){
      if(!points.length || points[points.length-1].elo!==before) points.push({elo:before,label:`경기 #${m.id} 전`,id:Number(m.id)});
      points.push({elo:after,label:`경기 #${m.id} 후`,id:Number(m.id)});
    }
  }
  return points;
}
function eloGraph(name) {
  const pts=eloHistory(name);
  if(!pts.length)return `<div class="graph-wrap"><div class="graph-head"><h3>📈 ELO 변화</h3><span class="muted">기록 없음</span></div><p class="empty">현재 제공된 경기 데이터에서 ELO 변화 기록을 찾지 못했습니다.</p></div>`;
  const values=pts.map(p=>p.elo), min=Math.min(...values), max=Math.max(...values);
  const pad=Math.max(50,Math.ceil((max-min)*.15)); const lo=Math.floor((min-pad)/50)*50, hi=Math.ceil((max+pad)/50)*50;
  const W=680,H=250,L=48,R=16,T=18,B=32, iw=W-L-R, ih=H-T-B;
  const x=i=>L+(pts.length===1?iw/2:i/(pts.length-1)*iw);
  const y=v=>T+(hi-v)/(hi-lo||1)*ih;
  const coords=pts.map((pt,i)=>`${x(i).toFixed(1)},${y(pt.elo).toFixed(1)}`).join(' ');
  const grid=Array.from({length:5},(_,i)=>{const val=lo+(hi-lo)*i/4;const yy=y(val);return `<line class="graph-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="graph-label" x="${L-8}" y="${yy+4}" text-anchor="end">${Math.round(val)}</text>`}).join('');
  const dots=pts.map((pt,i)=>`<circle class="graph-point" cx="${x(i)}" cy="${y(pt.elo)}" r="${i===pts.length-1?5:3}"/><title>${esc(pt.label)}: ${pt.elo} ELO</title>`).join('');
  const first=pts[0].elo,last=pts[pts.length-1].elo,delta=last-first;
  const trend=delta>0?`<span class="trend-positive">+${delta} ELO</span>`:delta<0?`<span class="trend-negative">${delta} ELO</span>`:`<strong>변화 없음</strong>`;
  return `<div class="graph-wrap"><div class="graph-head"><h3>📈 ELO 변화</h3><span class="muted">제공된 최근 경기 ${Math.ceil((pts.length-1)/2)}회 기준 · ${trend}</span></div><svg class="graph-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} ELO 변화 그래프">${grid}<polyline class="graph-line" points="${coords}"/>${dots}<text class="graph-label" x="${L}" y="${H-7}">과거</text><text class="graph-label" x="${W-R}" y="${H-7}" text-anchor="end">최근</text></svg><div class="muted">시작 ${first.toLocaleString()} ELO → 최근 ${last.toLocaleString()} ELO. 데이터는 현재 data.json에 포함된 경기 기록에 한정됩니다.</div></div>`;
}

      <label for="manageAction">작업</label><select id="manageAction"><option value="edit">선수 정보 수정</option><option value="delete">선수 삭제</option></select>
      <label for="managePlayer">대상 선수</label><select id="managePlayer" required>${opts}</select>
      <div id="editFields"><label for="manageNewName">새 선수 이름 (변경하지 않으면 비워 두기)</label><input id="manageNewName" maxlength="24" placeholder="새 이름 입력"><label for="manageRace">종족</label><select id="manageRace"><option value="변경 없음">변경 없음</option><option value="테란">테란</option><option value="저그">저그</option><option value="프로토스">프로토스</option><option value="랜덤">랜덤</option><option value="미정">미정</option></select><label for="manageElo">ELO (변경하지 않으면 비워 두기)</label><input id="manageElo" type="number" min="0" max="10000" step="1" placeholder="예: 1750"></div>
      <p id="deleteWarning" class="muted" style="display:none">삭제하면 현재 랭킹에서 제외됩니다. 현재 ELO/전적은 보관하고 기존 경기 및 시즌 기록은 유지합니다.</p>
      <button class="tab active" type="submit">GitHub에서 관리 요청하기 →</button>
    </form>`;
}
function submitManagement(event){
  event.preventDefault();
  const action=$('manageAction').value;
  const name=$('managePlayer').value;
  const newName=$('manageNewName').value.trim();
  const race=$('manageRace').value;
  const eloText=$('manageElo').value.trim();
  const elo=eloText===''?null:Number(eloText);
  const parts=location.pathname.split('/').filter(Boolean);
  const owner=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
  const repo=parts[0]||'sc-elo-board';
  if(!owner){alert('GitHub Pages 주소에서 저장소 정보를 확인할 수 없습니다.');return;}
  let title, body;
  if(action==='delete'){
    if(!confirm(`정말 ${name} 선수를 현재 랭킹에서 삭제할까요? 과거 경기 기록은 유지됩니다.`))return;
    title=`[선수관리:삭제] ${name}`;
    body=`작업: 삭제\n선수 이름: ${name}\n\nSC ELO BOARD 홈페이지에서 제출된 선수 삭제 요청입니다.`;
  }else{
    if(!newName&&race==='변경 없음'&&elo===null){alert('새 이름, 종족 또는 ELO 중 하나 이상을 변경해 주세요.');return;}
    if(elo!==null&&(!Number.isInteger(elo)||elo<0||elo>10000)){alert('ELO는 0~10000 사이의 정수로 입력해 주세요.');return;}
    title=`[선수관리:수정] ${name}`;
    body=`작업: 수정\n기존 선수 이름: ${name}\n새 선수 이름: ${newName}\n종족: ${race}\nELO: ${elo===null?'변경 없음':elo}\n\nSC ELO BOARD 홈페이지에서 제출된 선수 정보 수정 요청입니다.`;
  }
  const url=`https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  window.open(url,'_blank','noopener');
}

function showTeamBattleInput() {
  const battles=boardData.team_battles||[];
  const battleOptions=battles.map(b=>`<option value="${esc(b.id)}">#${esc(b.id)} · ${esc(b.title)} (${esc(b.team_a)} vs ${esc(b.team_b)})</option>`).join('');
  return `<div class="section-head"><h2>✍️ 대항전 결과 입력</h2><span class="muted">개인 ELO와 별도 기록</span></div>
    <p class="muted">다른 클랜 선수도 선수 등록 없이 이름을 직접 입력할 수 있습니다. 제출하면 GitHub에 요청 초안이 열립니다. 요청을 제출한 뒤 관리자가 확인하고 반영해야 홈페이지 기록에 나타납니다.</p>
    <div class="subsection"><h3>① 새 대항전 등록 요청</h3>
      <form id="teamBattleCreateForm" class="register-form">
        <label for="tbTitle">대항전 이름</label><input id="tbTitle" maxlength="100" required placeholder="예: 10월 정기 클랜전">
        <label for="tbTeamA">우리 클랜 이름</label><input id="tbTeamA" maxlength="80" required placeholder="예: SC ELO 클랜">
        <label for="tbTeamB">상대 클랜 이름</label><input id="tbTeamB" maxlength="80" required placeholder="예: 상대 클랜">
        <button class="tab active" type="submit">GitHub에 대항전 등록 요청 →</button>
      </form>
    </div>
    <div class="subsection"><h3>② 개인 경기 결과 등록 요청</h3>
      ${battles.length?`<form id="teamBattleGameForm" class="register-form">
        <label for="tbBattleId">대항전 선택</label><select id="tbBattleId" required>${battleOptions}</select>
        <label for="tbPlayerA">첫 번째 팀 선수 이름</label><input id="tbPlayerA" maxlength="80" required placeholder="선수 등록 여부와 관계없이 입력 가능">
        <label for="tbPlayerB">두 번째 팀 선수 이름</label><input id="tbPlayerB" maxlength="80" required placeholder="상대 선수 이름 직접 입력">
        <label for="tbWinner">승리한 팀</label><select id="tbWinner" required><option value="A">첫 번째 팀</option><option value="B">두 번째 팀</option></select>
        <button class="tab active" type="submit">GitHub에 개인 경기 등록 요청 →</button>
      </form>`:`<p class="empty">먼저 위에서 새 대항전 등록 요청을 제출하고, 관리자가 대항전을 등록한 뒤 개인 경기 결과를 입력할 수 있습니다.</p>`}
    </div>
    <p class="muted">참고: GitHub Pages는 정적 홈페이지라 이 화면에서 데이터베이스에 직접 저장하지 않습니다. 요청 제출 후 관리자의 확인·등록이 필요합니다. 대항전 기록은 개인 ELO와 승패에 반영되지 않습니다.</p>`;
}
function openTeamBattleIssue(title, body) {
  const owner=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
  const parts=location.pathname.split('/').filter(Boolean);
  const repo=parts[0]||'sc-elo-board';
  if(!owner){alert('GitHub Pages 주소에서 저장소 정보를 확인할 수 없습니다.');return;}
  const url=`https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  window.open(url,'_blank','noopener');
}
function submitTeamBattleCreate(event) {
  event.preventDefault();
  const title=$('tbTitle').value.trim(), teamA=$('tbTeamA').value.trim(), teamB=$('tbTeamB').value.trim();
  if(!title||!teamA||!teamB){alert('대항전 이름과 두 클랜 이름을 모두 입력해 주세요.');return;}
  if(teamA.toLocaleLowerCase('ko-KR')===teamB.toLocaleLowerCase('ko-KR')){alert('서로 다른 클랜 이름을 입력해 주세요.');return;}
  if(!confirm(`${title}\n${teamA} vs ${teamB}\n대항전 등록 요청을 제출할까요?`))return;
  openTeamBattleIssue(`[대항전등록] ${title}`,`요청 종류: 대항전 등록\n대항전 이름: ${title}\n첫 번째 팀: ${teamA}\n두 번째 팀: ${teamB}\n\nSC ELO BOARD 홈페이지의 대항전 입력 화면에서 제출된 요청입니다. 개인 ELO와 무관한 대항전입니다.`);
}
function submitTeamBattleGame(event) {
  event.preventDefault();
  const battleId=$('tbBattleId').value, battle=(boardData.team_battles||[]).find(b=>String(b.id)===String(battleId));
  const playerA=$('tbPlayerA').value.trim(), playerB=$('tbPlayerB').value.trim(), winner=$('tbWinner').value;
  if(!battle||!playerA||!playerB){alert('대항전과 두 선수 이름을 모두 입력해 주세요.');return;}
  if(playerA.toLocaleLowerCase('ko-KR')===playerB.toLocaleLowerCase('ko-KR')){alert('서로 다른 선수 이름을 입력해 주세요.');return;}
  const winnerName=winner==='A'?battle.team_a:battle.team_b;
  if(!confirm(`#${battle.id} ${battle.title}\n${battle.team_a} · ${playerA} vs ${battle.team_b} · ${playerB}\n승리 팀: ${winnerName}\n개인 경기 등록 요청을 제출할까요?`))return;
  openTeamBattleIssue(`[대항전개인전등록] #${battle.id} ${playerA} vs ${playerB}`,`요청 종류: 대항전 개인 경기 등록\n대항전 번호: ${battle.id}\n대항전 이름: ${battle.title}\n첫 번째 팀: ${battle.team_a}\n첫 번째 팀 선수: ${playerA}\n두 번째 팀: ${battle.team_b}\n두 번째 팀 선수: ${playerB}\n승리 팀: ${winner}\n\nSC ELO BOARD 홈페이지의 대항전 입력 화면에서 제출된 요청입니다. 기존 개인 ELO/승패에는 반영하지 않습니다.`);
}

function showTeamBattles() {
  const battles=boardData.team_battles||[];
  if(!battles.length)return `<h2>🛡️ 대항전 기록</h2><p class="empty">아직 등록된 대항전이 없습니다. 디스코드에서 관리자 명령어 <b>/대항전등록</b>으로 시작해 주세요.</p>`;
  return `<div class="section-head"><h2>🛡️ 대항전 기록</h2><span class="muted">개인 ELO와 별도 관리</span></div><div class="matches">${battles.map(b=>{
    const a=Number(b.score_a||0), z=Number(b.score_b||0);
    const status=(b.games||[]).length===0?"경기 전":a===z?"동점":a>z?`${b.team_a} 승리`:`${b.team_b} 승리`;
    const games=(b.games||[]).length?`<div class="subsection"><h3>개인 경기 결과</h3>${b.games.map((g,i)=>`<article class="match"><div class="match-top"><strong>${i+1}경기</strong><span class="muted">${esc(g.played_at||"")}</span></div><div class="result">${esc(b.team_a)} · ${esc(g.team_a_player)} vs ${esc(b.team_b)} · ${esc(g.team_b_player)}<br><strong>승리 팀: ${esc(g.winner_team==="A"?b.team_a:b.team_b)}</strong></div></article>`).join("")}</div>`:`<p class="empty">아직 개인 경기 기록이 없습니다.</p>`;
    return `<article class="match"><div class="match-top"><div><strong>#${esc(b.id)} · ${esc(b.title)}</strong><div class="muted">${esc(b.played_at||"")}</div></div><span class="badge">${esc(status)}</span></div><div class="result" style="display:flex;align-items:center;justify-content:space-around;gap:10px;text-align:center;padding:18px 4px"><div><strong>${esc(b.team_a)}</strong></div><div style="font-size:1.5rem;font-weight:900">${a} : ${z}</div><div><strong>${esc(b.team_b)}</strong></div></div><p class="muted">개인 경기 ${(b.games||[]).length}회 · 개인 ELO/전적에는 반영되지 않음</p>${games}</article>`;
  }).join("")}</div>`;
}

function showSeasons() {
  const seasons=boardData.seasons||[];
  if(!seasons.length)return `<h2>시즌 기록</h2><p class="empty">시즌 기록이 없습니다.</p>`;
  return `<div class="section-head"><h2>시즌 기록 & 우승자</h2><span class="muted">시즌을 선택해 최종 랭킹 보기</span></div><div class="season-list">${seasons.map(s=>{
    const ordered=[...(s.players||[])].sort((a,b)=>Number(b.elo)-Number(a.elo)||Number(b.wins)-Number(a.wins));
    const champ=!s.is_active&&ordered.length?ordered[0]:null;
    return `<div class="season" data-season="${s.id}"><strong>${esc(s.name)} ${s.is_active?"🟢 진행 중":"🏁 종료"}</strong><small>시작: ${esc(s.started_at||"-")} · 경기 ${s.match_count||0}회${s.ended_at?" · 종료: "+esc(s.ended_at):""}</small>${champ?`<div class="season-champ">🏆 시즌 우승자: ${esc(champ.name)} · ${Number(champ.elo).toLocaleString()} ELO</div>`:`<div class="muted" style="margin-top:8px">${s.is_active?"진행 중인 시즌입니다.":"저장된 최종 랭킹이 없습니다."}</div>`}<div class="muted" style="margin-top:7px">눌러서 시즌 랭킹 보기</div></div>`;
  }).join("")}</div><div id="seasonRanking" style="margin-top:18px"></div>`;
}
function wirePlayerLinks(root=document) {
  root.querySelectorAll("[data-player]").forEach(el=>el.addEventListener("click",()=>{
    const name=el.getAttribute("data-player");
    $("content").innerHTML=playerDetail(name);
    const back=$("backPlayers");
    if(back) back.addEventListener("click",()=>render("players"));
    window.scrollTo({top:0,behavior:"smooth"});
    wirePlayerLinks($("content"));
  }));
}
function render(tab=currentTab) {
  currentTab=tab;
  document.querySelectorAll(".tab[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  const content=$("content");
  if(tab==="ranking")content.innerHTML=showRanking(boardData.players);
  if(tab==="matches")content.innerHTML=showMatches();
  if(tab==="teammatches")content.innerHTML=showTeamBattles();
  if(tab==="teambattleinput")content.innerHTML=showTeamBattleInput();
  if(tab==="matchregister")content.innerHTML=showMatchRegistration();
  if(tab==="players")content.innerHTML=showPlayerSearch();
  if(tab==="register")content.innerHTML=showRegistration();
  if(tab==="bulkregister")content.innerHTML=showBulkRegistration();
  if(tab==="manage")content.innerHTML=showManagement();
  if(tab==="headtohead")content.innerHTML=showHeadToHead();
  if(tab==="seasons")content.innerHTML=showSeasons();
  if(tab==="players"){
    $("playerQuery").addEventListener("input",e=>{$("playerResults").innerHTML=playerResults(e.target.value);wirePlayerLinks($("playerResults"));});
  }
  if(tab==="register"){
    const form=$("registerForm"); if(form)form.addEventListener("submit",submitRegistration);
  }
  if(tab==="bulkregister"){
    const form=$("bulkRegisterForm"); if(form)form.addEventListener("submit",submitBulkRegistration);
  }
  if(tab==="matchregister"){
    const form=$("matchRegisterForm");
    if(form)form.addEventListener("submit",submitMatchRegistration);
  }
  if(tab==="teambattleinput"){
    const createForm=$("teamBattleCreateForm"), gameForm=$("teamBattleGameForm");
    if(createForm)createForm.addEventListener("submit",submitTeamBattleCreate);
    if(gameForm)gameForm.addEventListener("submit",submitTeamBattleGame);
  }
  if(tab==="manage"){
    const form=$("manageForm"), action=$("manageAction"), fields=$("editFields"), warning=$("deleteWarning");
    const updateAction=()=>{const deleting=action.value==="delete";fields.style.display=deleting?"none":"block";warning.style.display=deleting?"block":"none";};
    if(action){action.addEventListener("change",updateAction);updateAction();}
    if(form)form.addEventListener("submit",submitManagement);
  }
  if(tab==="headtohead"){
    const a=$("compareA"), b=$("compareB");
    if(a&&b){a.addEventListener("change",()=>{if(a.value===b.value){const other=[...b.options].find(o=>o.value!==a.value);if(other)b.value=other.value;}renderHeadToHead();});b.addEventListener("change",()=>{if(a.value===b.value){const other=[...a.options].find(o=>o.value!==b.value);if(other)a.value=other.value;}renderHeadToHead();});renderHeadToHead();}
  }
  if(tab==="seasons"){
    content.querySelectorAll("[data-season]").forEach(el=>el.addEventListener("click",()=>{
      content.querySelectorAll("[data-season]").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
      const season=boardData.seasons.find(s=>s.id===Number(el.dataset.season));
      $("seasonRanking").innerHTML=showRanking(season?.players||[],`${season?.name||"시즌"} 최종 랭킹`,false);
      wirePlayerLinks($("seasonRanking"));
    }));
  }
  wirePlayerLinks(content);
}
async function loadData(){
  try{
    const response=await fetch("./data.json?cache="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("data.json을 불러오지 못했습니다.");
    boardData=await response.json();
    $("activeSeason").textContent=boardData.active_season?.name||"-";
    $("playerCount").textContent=(boardData.players||[]).length+"명";
    $("matchCount").textContent=(boardData.seasons||[]).find(s=>s.is_active)?.match_count??(boardData.matches||[]).length;
    $("updated").textContent="마지막 데이터 갱신: "+(boardData.updated_at||"정보 없음");
    $("lastSync").textContent=boardData.updated_at? "· "+new Date(boardData.updated_at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):"";
    render(currentTab);
  }catch(error){
    $("content").innerHTML=`<h2>데이터 연결을 기다리는 중입니다</h2><p class="empty">data.json을 불러오지 못했습니다. GitHub 저장소에 index.html과 data.json이 있는지 확인하고 잠시 후 새로고침해 주세요.</p>`;
    $("updated").textContent="";
  }
}
document.querySelectorAll(".tab[data-tab]").forEach(b=>b.addEventListener("click",()=>{if(boardData)render(b.dataset.tab)}));
loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
