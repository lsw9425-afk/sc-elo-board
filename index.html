<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>SC ELO BOARD</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--panel:#141e30;--line:#26354b;--text:#eef4ff;--muted:#9aabc4;--gold:#f5c451;--blue:#77b7ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172944 0,#0b1120 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}.hero{padding:26px 0 20px}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.16em;font-size:.75rem}
    h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;margin:10px 0}.sub{color:var(--muted);margin:0}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0 28px}.stat,.panel{background:rgba(20,30,48,.92);border:1px solid var(--line);border-radius:16px}
    .stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{display:block;font-size:1.5rem;margin-top:5px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#121b2c;color:var(--text);padding:10px 14px;border-radius:999px;cursor:pointer}.tab.active{background:var(--gold);color:#201804;border-color:var(--gold);font-weight:800}
    .panel{padding:18px;margin-bottom:18px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h2{font-size:1.2rem;margin:0}.muted{color:var(--muted);font-size:.85rem}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.78rem;color:var(--muted);font-weight:700}tbody tr:last-child td{border-bottom:0}.rankno{color:var(--gold);font-weight:900}.elo{font-weight:900}.badge{display:inline-block;border:1px solid #465671;border-radius:7px;padding:3px 7px;font-size:.75rem;font-weight:800}.S{color:#ffb7d4}.A{color:#ff9e75}.B{color:#f5c451}.C{color:#80c8ff}.D{color:#b4c0d4}.E{color:#9aa4b4}
    .matches{display:grid;gap:10px}.match{padding:14px;border:1px solid var(--line);border-radius:12px;background:#10192a}.match-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.winner{color:#8de0b2;font-weight:800}.loser{color:#ffaaa7;font-weight:800}.result{color:var(--muted);font-size:.85rem;margin-top:8px}
    .season-list{display:grid;gap:10px}.season{padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#10192a}.season:hover{border-color:var(--blue)}.season strong{display:block}.season small{color:var(--muted)}
    input{width:100%;background:#0c1422;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 12px;font:inherit}
    footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}.empty{color:var(--muted);padding:16px 0}
    @media(max-width:600px){.wrap{padding:18px 12px 40px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:1.2rem}.panel{padding:13px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">STARCRAFT · ELO RANKING</div>
    <h1>SC ELO BOARD</h1>
    <p class="sub">디스코드 경기 등록과 자동 연동되는 스타크래프트 랭킹 보드</p>
  </header>
  <section class="stats">
    <div class="stat"><span>진행 중인 시즌</span><strong id="activeSeason">불러오는 중</strong></div>
    <div class="stat"><span>등록 선수</span><strong id="playerCount">-</strong></div>
    <div class="stat"><span>현재 시즌 경기</span><strong id="matchCount">-</strong></div>
  </section>
  <nav class="tabs">
    <button class="tab active" data-tab="ranking">현재 랭킹</button>
    <button class="tab" data-tab="matches">최근 경기</button>
    <button class="tab" data-tab="players">선수 검색</button>
    <button class="tab" data-tab="seasons">시즌 기록</button>
  </nav>
  <main id="content" class="panel"><p class="empty">데이터를 불러오는 중입니다…</p></main>
  <footer>SC ELO BOARD · 데이터는 디스코드 봇에서 자동 갱신됩니다.<br><span id="updated"></span></footer>
</div>
<script>
let boardData = null;
let currentTab = "ranking";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showRanking(players, title="현재 시즌 랭킹") {
  if (!players?.length) return `<h2>${esc(title)}</h2><p class="empty">표시할 선수 기록이 없습니다.</p>`;
  return `<div class="section-head"><h2>${esc(title)}</h2><span class="muted">${players.length}명</span></div>
    <div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>ELO</th><th>등급</th><th>전적</th><th>승률</th></tr></thead><tbody>
    ${players.map((p,i)=>`<tr><td class="rankno">${i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"위"}</td><td><strong>${esc(p.name)}</strong></td><td class="elo">${Number(p.elo).toLocaleString()}</td><td><span class="badge ${esc(p.rank)}">${esc(p.rank)}</span></td><td>${p.wins}승 ${p.losses}패</td><td>${p.win_rate ?? ((p.wins+p.losses)?(p.wins/(p.wins+p.losses)*100).toFixed(1):"0.0")}%</td></tr>`).join("")}
    </tbody></table></div>`;
}
function showMatches() {
  const matches = boardData.matches || [];
  if (!matches.length) return `<h2>최근 경기</h2><p class="empty">현재 시즌에 등록된 경기가 없습니다.</p>`;
  return `<div class="section-head"><h2>최근 경기</h2><span class="muted">최대 50경기</span></div><div class="matches">
    ${matches.map(m=>`<article class="match"><div class="match-top"><div><span class="winner">${esc(m.winner)}</span> <span class="muted">승리 vs</span> <span class="loser">${esc(m.loser)}</span></div><span class="muted">#${m.id}</span></div>
    <div class="result">${esc(m.winner_elo_before)} → <strong>${esc(m.winner_elo_after)}</strong> (+${esc(m.elo_change)}) · ${esc(m.loser_elo_before)} → <strong>${esc(m.loser_elo_after)}</strong> (-${esc(m.elo_change)})<br>${esc(m.played_at || "")}</div></article>`).join("")}
    </div>`;
}
function showPlayerSearch() {
  return `<h2 style="margin-bottom:14px">선수 검색</h2><input id="playerQuery" placeholder="선수 이름을 입력하세요" autocomplete="off"><div id="playerResults">${playerResults("")}</div>`;
}
function playerResults(query) {
  const players=(boardData.players||[]).filter(p=>p.name.toLowerCase().includes(query.trim().toLowerCase()));
  if(!players.length)return `<p class="empty">검색 결과가 없습니다.</p>`;
  return `<div class="table-wrap"><table><thead><tr><th>선수</th><th>ELO</th><th>등급</th><th>전적</th><th>승률</th></tr></thead><tbody>${players.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td class="elo">${p.elo}</td><td><span class="badge ${esc(p.rank)}">${esc(p.rank)}</span></td><td>${p.wins}승 ${p.losses}패</td><td>${p.win_rate}%</td></tr>`).join("")}</tbody></table></div>`;
}
function showSeasons() {
  const seasons=boardData.seasons||[];
  if(!seasons.length)return `<h2>시즌 기록</h2><p class="empty">시즌 기록이 없습니다.</p>`;
  return `<div class="section-head"><h2>시즌 기록</h2><span class="muted">시즌을 선택해 최종 랭킹 보기</span></div><div class="season-list">${seasons.map(s=>`<div class="season" data-season="${s.id}"><strong>${esc(s.name)} ${s.is_active?"🟢 진행 중":"🏁 종료"}</strong><small>시작: ${esc(s.started_at||"-")} · 경기 ${s.match_count}회${s.ended_at?" · 종료: "+esc(s.ended_at):""}</small><div class="muted" style="margin-top:6px">눌러서 이 시즌의 랭킹 보기</div></div>`).join("")}</div><div id="seasonRanking" style="margin-top:18px"></div>`;
}
function render(tab=currentTab) {
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  const content=$("content");
  if(tab==="ranking")content.innerHTML=showRanking(boardData.players);
  if(tab==="matches")content.innerHTML=showMatches();
  if(tab==="players")content.innerHTML=showPlayerSearch();
  if(tab==="seasons")content.innerHTML=showSeasons();
  if(tab==="players"){
    $("playerQuery").addEventListener("input",e=>{$("playerResults").innerHTML=playerResults(e.target.value)});
  }
  if(tab==="seasons"){
    content.querySelectorAll("[data-season]").forEach(el=>el.addEventListener("click",()=>{
      const season=boardData.seasons.find(s=>s.id===Number(el.dataset.season));
      $("seasonRanking").innerHTML=showRanking(season?.players||[],`${esc(season?.name||"시즌")} 랭킹`);
    }));
  }
}
async function loadData(){
  try{
    const response=await fetch("./data.json?cache="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("data.json을 불러오지 못했습니다.");
    boardData=await response.json();
    $("activeSeason").textContent=boardData.active_season?.name||"-";
    $("playerCount").textContent=(boardData.players||[]).length+"명";
    $("matchCount").textContent=(boardData.seasons||[]).find(s=>s.is_active)?.match_count??(boardData.matches||[]).length;
    $("updated").textContent="마지막 데이터 갱신: "+(boardData.updated_at||"정보 없음");
    render(currentTab);
  }catch(error){
    $("content").innerHTML=`<h2>데이터 연결을 기다리는 중입니다</h2><p class="empty">아직 data.json이 게시되지 않았습니다. 봇 설정과 GitHub Pages 설정을 확인한 뒤 잠시 후 새로고침해 주세요.</p>`;
    $("updated").textContent="";
  }
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{if(boardData)render(b.dataset.tab)}));
loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
